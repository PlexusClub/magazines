<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plexus Magazine Collection</title>
    <link rel="shortcut icon" href="/assets/Plexus.png" type="image/x-icon">
    <link href="./dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="./dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            padding: 5vh 0;
        }

        .bookshelf {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .book-launcher {
            cursor: pointer;
            text-align: center;
        }

        ._df_thumb {
            width: 280px;
            height: 380px;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
            font-size: 0;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .book-launcher:not(.coming-soon):hover ._df_thumb {
            padding: 20px;
        }

        .book-launcher h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .book-launcher p {
            font-size: 0.9rem;
            font-weight: 300;
            color: #aaaaaa;
            margin: 0;
        }

        .book-launcher.coming-soon {
            cursor: not-allowed;
            pointer-events: none;
            user-select: none;
        }

        .book-launcher.coming-soon ._df_thumb {
            filter: grayscale(80%);
        }

        .book-launcher.coming-soon ._df_thumb::after {
            content: 'Coming Soon';
            position: absolute;
            top: 20px;
            right: -50px;
            background-color: #ffc107;
            color: #000;
            padding: 8px 10px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            width: 200px;
            transform: rotate(45deg);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>

</head>

<body>

    <div class="bookshelf" id="bookshelf-container">
    </div>


    <script src="./dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="./dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            DFLIP.defaults.theme = 'dark';
            DFLIP.defaults.backgroundColor = '#2a2a2a';
            const bookshelf = document.getElementById('bookshelf-container');
            fetch('./data.json')
                .then(response => response.json())
                .then(data => {
                    data.magazines.forEach(magazine => {
                        if (magazine.source) {
                            // AVAILABLE BOOK
                            bookshelf.innerHTML += `
                            <div class="book-launcher">
                                <div class="_df_thumb" 
                                     source="${magazine.source}"
                                     thumb="${magazine.thumb}">
                                     ${magazine.thumbname}
                                </div>
                                <h2>${magazine.title}</h2>
                                <p>${magazine.desc}</p>
                            </div>
                            `;
                        } else {
                            // COMING SOON BOOK
                            bookshelf.innerHTML += `
                            <div class="book-launcher coming-soon">
                                <div class="_df_thumb" 
                                     thumb="${magazine.thumb}">
                                     ${magazine.thumbname}
                                </div>
                                <h2>${magazine.title}</h2>
                                <p>${magazine.desc}</p>
                            </div>
                            `;
                        }
                    });
                    DFLIP.parseBooks();

                })
                .catch(error => {
                    console.error('Error fetching magazine data:', error);
                    bookshelf.innerHTML = '<p style="color: red; text-align: center;">Could not load magazines. Please check data.json.</p>';
                });
        });
    </script>

</body>

</html>
